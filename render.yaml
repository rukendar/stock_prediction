databases:
  - name: growup-db
    plan: free

services:
  - type: web
    name: growup-stock-ai
    env: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: growup-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SQ_HIVE_API_KEY
        value: ""
    disk:
      name: growup-disk
      mountPath: /app/storage
      sizeGB: 1
